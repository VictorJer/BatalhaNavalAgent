<main class="flex min-h-dvh flex-col items-center gap-6 p-4 text-center sm:p-6">
  <h1 class="flex items-center gap-3 text-4xl font-bold tracking-tight text-slate-100 sm:text-5xl">
    <svg lucideIcon="ship" class="size-8 text-acerto" aria-hidden="true"></svg>
    {{ titulo() }}
  </h1>

  @if (fase() !== 'preparacao') {
    <app-tela-de-batalha />
  } @else if (apresentacaoPendente()) {
    <app-tela-inicial (iniciar)="comecarAJogar()" />
  } @else {
    <p class="max-w-prose text-base text-slate-300 sm:text-lg">
      Posicione sua frota e destrua a esquadra inimiga antes que a sua seja afundada.
    </p>
    <app-tela-de-preparacao />
  }
</main>
